[package]
name = "live-cmd-app"
version = "0.2.3"
edition = "2024"
description = "live-cmd: app de bandeja do Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
live-cmd-echo = { path = ".." }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
vt100 = "0.18.1"
png = "0.18"
qrcode = { version = "0.14.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

# Mesmo patch do host (`desktop/Cargo.toml`): patch só vale na raiz do build.
[patch.crates-io]
rtc = { git = "https://github.com/webrtc-rs/rtc", rev = "70901c3df6ad92dcb87d97af3d1e2fa8a2e2ae38" }
