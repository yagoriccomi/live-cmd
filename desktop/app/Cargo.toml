[package]
name = "live-cmd-app"
version = "0.1.0"
edition = "2024"
description = "live-cmd: app de bandeja do Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
qrcode = { version = "0.14.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
