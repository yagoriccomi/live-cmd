[package]
name = "live-cmd-echo"
version = "0.1.0"
edition = "2024"

[dependencies]
webrtc = "=0.21.1"
tokio-tungstenite = { version = "=0.30.0", features = ["native-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
keyring = { version = "3.6.3", features = ["windows-native"] }
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14", default-features = false }
vt100 = "0.18.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Time", "Win32_System_SystemInformation"] }

[patch.crates-io]
rtc = { git = "https://github.com/webrtc-rs/rtc", rev = "70901c3df6ad92dcb87d97af3d1e2fa8a2e2ae38" }
